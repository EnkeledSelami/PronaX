<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PronaX</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; background: #050505; color: #e8eee9; font-family: "Segoe UI", Arial, sans-serif; }
    main { width: min(500px, calc(100vw - 42px)); text-align: center; }
    img { display: block; width: 100%; height: auto; margin: 0 auto 22px; }
    p { margin: 0; color: #a6b4ab; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    .loading { display: flex; justify-content: center; gap: 6px; margin-top: 19px; }
    .loading i { width: 5px; height: 5px; border-radius: 50%; background: #48bb82; animation: pulse 1s ease-in-out infinite; }
    .loading i:nth-child(2) { animation-delay: .15s; }
    .loading i:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.75); } 40% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <main>
    <img src="../public/pronax-full-logo.jpg" alt="PronaX — Know Your Location">
    <p>Albania neighbourhood intelligence</p>
    <span class="loading" aria-label="Loading"><i></i><i></i><i></i></span>
  </main>
</body>
</html>
